<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Canvas 通知</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-body"><main class="login-box"><span class="brand-mark">C<span>·</span></span><h1>学习动态，有迹可循。</h1><p>登录个人通知工作台，查看课程更新与下一次提醒。</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">管理密码</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="primary">登录工作台 <span aria-hidden="true">→</span></button></form><small>首次使用请查看本地 secrets/admin-password 文件。<br>此密码仅用于本服务。</small></main></body></html>
