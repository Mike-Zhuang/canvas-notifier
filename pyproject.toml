[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-notifier"
version = "0.1.0"
description = "Personal, read-only Canvas notification service"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.8,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "typer>=0.15,<1",
  "aiosmtplib>=4,<6",
  "bleach>=6.2,<7",
  "email-validator>=2.2,<3",
  "cryptography>=44,<48",
]
[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "aiosmtpd>=1.4.6,<2"]
[project.scripts]
canvas-notifier = "canvas_notifier.cli:app"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test-*.py", "test_*.py"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.hatch.build.targets.wheel]
packages = ["src/canvas_notifier"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/migrations", "/docs", "/deploy", "/README.md",
  "/pyproject.toml", "/uv.lock", "/alembic.ini", "/.env.example", "/.gitignore"
]
exclude = ["**/__pycache__", "**/*.pyc"]
